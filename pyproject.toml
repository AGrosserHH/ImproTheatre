[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "improtheatre"
version = "0.1.0"
description = "Local desktop improv assistant with a complementary AI coaching layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AGrosserHH" }
]
dependencies = [
  "PySide6>=6.8,<7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<0.12"
]
packaging = [
  "pyinstaller>=6.11,<7.0"
]

[project.scripts]
improtheatre = "improtheatre.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/improtheatre"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
